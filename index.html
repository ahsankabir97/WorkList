<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="60"> 
    <title>Work Assigned Dashboard | Modern UI</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --success-gradient: linear-gradient(135deg, #00b09b 0%, #96c93d 100%);
            --danger-gradient: linear-gradient(135deg, #ff5f6d 0%, #ffc371 100%);
            --bg-color: #f8f9fd;
            --white: #ffffff;
            --radius: 16px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background-color: var(--bg-color); padding: 20px; color: #2d3436; }
        .container { max-width: 1200px; margin: 0 auto; }

        header {
            background: var(--primary-gradient);
            padding: 15px 25px; border-radius: var(--radius); color: white;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 10px 30px rgba(118, 75, 162, 0.3); margin-bottom: 25px;
        }

        header h1 {
            font-size: 1.4rem;
            letter-spacing: 1px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .header-info { text-align: right; }
        #liveDate { font-size: 0.85rem; opacity: 1; font-weight: 700; }
        #liveClock { font-weight: 700; font-size: 1.0rem; }

        .card { 
            background: var(--white); border-radius: var(--radius); padding: 25px; 
            margin-bottom: 25px; box-shadow: 0 8px 20px rgba(0,0,0,0.04);
            position: relative; overflow: hidden; border: 1px solid rgba(0,0,0,0.05);
        }

        .card-new { border-top: 6px solid #667eea; }
        .card-ongoing { border-top: 6px solid #f5576c; }
        .card-completed { border-top: 6px solid #00b09b; }

        .sheet-wrapper {
            width: 100%; height: 250px; overflow: hidden;
            border-radius: 10px; border: 1px solid #edf2f7; background: #fff; position: relative;
        }
        .sheet-wrapper iframe { width: 100%; height: 310px; border: none; position: absolute; top: 0; left: 0; }

        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; align-items: end; }
        .input-group { display: flex; flex-direction: column; gap: 8px; }
        label { font-size: 0.85rem; font-weight: 600; color: #636e72; }
        
        /* Date input styling for better visibility */
        input, select { 
            padding: 12px; border: 2px solid #edf2f7; border-radius: 10px; 
            outline: none; font-family: inherit; font-size: 0.85rem; 
            background: #fff;
        }

        .btn-assign { 
            background: var(--primary-gradient); color: white; border: none; padding: 14px; 
            border-radius: 10px; font-weight: 700; cursor: pointer; text-transform: uppercase; 
        }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { text-align: left; padding: 15px; background: #f1f4f8; font-size: 0.75rem; color: #7f8c8d; text-transform: uppercase; }
        td { padding: 15px; border-bottom: 1px solid #f1f2f6; font-size: 0.85rem; }

        .badge { padding: 6px 14px; border-radius: 30px; font-weight: 600; color: white; font-size: 0.7rem; }
        .bg-sumon { background: #20bf6b; } .bg-alamin { background: #f0932b; }
        .bg-nahid { background: #eb4d4b; } .bg-fahim { background: #5f27cd; }

        .status-working { color: #f5576c; font-weight: 700; animation: blink 1.5s infinite; }
        @keyframes blink { 50% { opacity: 0.4; } }

        .btn-done { 
            background: var(--success-gradient); color: white; border: none; padding: 6px 12px; 
            border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.7rem; margin-top: 5px; display: block;
        }

        .search-box { padding: 8px 12px; border: 2px solid #00b09b; border-radius: 10px; font-size: 0.8rem; }
        .btn-clear { background: var(--danger-gradient); color: white; border: none; padding: 10px 18px; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 0.8rem; }
        
        @media (max-width: 768px) {
            header { flex-direction: column; gap: 5px; text-align: center; padding: 10px; }
            header h1 { font-size: 1rem; }
            .header-info { text-align: center; }
            .form-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Work Dashboard</h1>
        <div class="header-info">
            <div id="liveDate"></div>
            <div id="liveClock"></div>
        </div>
    </header>

    <div class="card" style="border-top: 6px solid #4834d4;">
        <div style="font-weight:700; margin-bottom:15px; color:#4834d4; font-size: 0.9rem;">📊 TASK LIVE SUMMARY</div>
        <div class="sheet-wrapper">
            <iframe src="https://docs.google.com/spreadsheets/d/e/2PACX-1vTYE61oI9ahQllfKmXmV-ulhGeFDi16gBDgHN8b4NWk9Y3bLyxnyc8S06Wk_TTU21YzVFj2aKKvHDJG/pubhtml?gid=337897408&single=true&widget=false&headers=false&range=A1:M7"></iframe>
        </div>
    </div>

    <div class="card card-new">
        <div style="font-weight:700; margin-bottom:15px; color:#667eea; font-size: 0.9rem;">🚀 CREATE NEW ASSIGNMENT</div>
        <div class="form-grid">
            <div class="input-group">
                <label>Date</label>
                <input type="date" id="dateInput" onchange="handleDateChange()">
            </div>
            <div class="input-group">
                <label>Ticket ID</label>
                <input type="text" id="ticketInput" placeholder="L3-DDMonYY-">
            </div>
            <div class="input-group">
                <label>Area</label>
                <select id="areaInput">
                    <option value="">Select Area</option>
                    <option value="Aganagar">Aganagar</option>
                    <option value="Babubazar">Babubazar</option>
                    <option value="Bangshal">Bangshal</option>
                    <option value="Chawkbazar">Chawkbazar</option>
                    <option value="Dhalpur">Dhalpur</option>
                    <option value="Donia">Donia</option>
                    <option value="Eskaton">Eskaton</option>
                    <option value="Ganderia">Ganderia</option>
                    <option value="Gulistan">Gulistan</option>
                    <option value="Imamganj">Imamganj</option>
                    <option value="Islampur">Islampur</option>
                    <option value="Jatrabari">Jatrabari</option>
                    <option value="Jurain">Jurain</option>
                    <option value="Kakrail">Kakrail</option>
                    <option value="Kamlapur">Kamlapur</option>
                    <option value="Keraniganj">Keraniganj</option>
                    <option value="Lalbagh">Lalbagh</option>
                    <option value="Matuail">Matuail</option>
                    <option value="Mitford">Mitford</option>
                    <option value="Moghbazar">Moghbazar</option>
                    <option value="Motijheel">Motijheel</option>
                    <option value="Moulovibazar">Moulovibazar</option>
                    <option value="Rajarbag">Rajarbag</option>
                    <option value="Ramna">Ramna</option>
                    <option value="RK Mission Road">RK Mission Road</option>
                    <option value="SadarGhat">SadarGhat</option>
                    <option value="SanirAkhra">SanirAkhra</option>
                    <option value="Segunbagicha">Segunbagicha</option>
                    <option value="Shahjahanpur">Shahjahanpur</option>
                    <option value="Shantinagar">Shantinagar</option>
                    <option value="Shyampur">Shyampur</option>
                    <option value="Tikatuli">Tikatuli</option>
                    <option value="Wari">Wari</option>
                </select>
            </div>
            <div class="input-group">
                <label>Staff</label>
                <select id="personInput">
                    <option value="">Assign to...</option>
                    <option value="Sumon">Sumon</option>
                    <option value="Alamin">Alamin</option>
                    <option value="Nahid">Nahid</option>
                    <option value="Fahim">Fahim</option>
                </select>
            </div>
            <button class="btn-assign" id="assignBtn" onclick="addTask()">Assign</button>
        </div>
    </div>

    <div class="card card-ongoing">
        <div style="font-weight:700; margin-bottom:15px; color:#f5576c; font-size: 0.9rem;">⏳ ONGOING TASKS (WORKING)</div>
        <div style="overflow-x:auto;">
            <table id="ongoingTable">
                <thead>
                    <tr><th>Date & Action</th><th>Start</th><th>Ticket ID</th><th>Area</th><th>Staff</th><th>Status</th></tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <div class="card card-completed">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
            <span style="font-weight:700; color:#00b09b; font-size: 0.9rem;">✅ COMPLETED (TODAY)</span>
            <div style="display:flex; gap:10px;">
                <input type="date" id="searchDate" class="search-box" onchange="renderAll()">
                <button class="btn-clear" onclick="clearCompleted()">Clear</button>
            </div>
        </div>
        <div style="overflow-x:auto;">
            <table id="completedTable">
                <thead>
                    <tr><th>Date</th><th>Start</th><th>End</th><th>Ticket</th><th>Area</th><th>Staff</th><th>Status</th></tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const G_URL = "https://script.google.com/macros/s/AKfycbz1ZE69wIfAem_gmCk5v-_2tH6ohSOdZoUkFpE1c0HRnQSqZxHfHVzTvVRAqjCcdB0/exec";
    let ongoing = JSON.parse(localStorage.getItem('ongoing_v14')) || [];
    let completed = JSON.parse(localStorage.getItem('completed_v14')) || [];

    // Helper to format date as DD-MM-YYYY
    function formatDateDisplay(dateStr) {
        if (!dateStr) return "";
        const parts = dateStr.split('-');
        if (parts.length !== 3) return dateStr;
        return `${parts[2]}-${parts[1]}-${parts[0]}`;
    }

    function handleDateChange() {
        updateTicketPrefix();
    }

    document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('dateInput').valueAsDate = new Date();
        updateTicketPrefix();
        renderAll();
        
        setInterval(() => { 
            const now = new Date();
            document.getElementById('liveClock').innerText = now.toLocaleTimeString(); 
            document.getElementById('liveDate').innerText = now.toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric', year: 'numeric' });
        }, 1000);
    });

    function updateTicketPrefix() {
        const d = new Date(document.getElementById('dateInput').value);
        const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
        document.getElementById('ticketInput').value = `L3-${d.getDate()}${months[d.getMonth()]}${d.getFullYear().toString().substr(-2)}-`;
    }

    async function addTask() {
        const btn = document.getElementById('assignBtn');
        const task = {
            date: document.getElementById('dateInput').value,
            ticket: document.getElementById('ticketInput').value,
            area: document.getElementById('areaInput').value,
            person: document.getElementById('personInput').value,
            startTime: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
            remarks: "Working", id: Date.now()
        };
        if(!task.ticket || !task.area || !task.person) return alert("Fill all fields!");
        btn.innerText = "Syncing..."; btn.disabled = true;
        try {
            await fetch(G_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(task) });
            ongoing.push(task);
            saveData(); renderAll();
        } catch(e) { alert("Failed!"); }
        finally { btn.innerText = "Assign"; btn.disabled = false; }
    }

    async function markDone(id) {
        const idx = ongoing.findIndex(t => t.id === id);
        const doneTime = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        const task = {...ongoing[idx], doneTime, remarks: "Done"};
        try {
            await fetch(G_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(task) });
            completed.unshift(ongoing.splice(idx, 1)[0]);
            completed[0].doneTime = doneTime; completed[0].remarks = "Done";
            saveData(); renderAll();
        } catch(e) { alert("Error!"); }
    }

    function clearCompleted() { if(confirm("Clear list?")) { completed = []; saveData(); renderAll(); } }
    function saveData() {
        localStorage.setItem('ongoing_v14', JSON.stringify(ongoing));
        localStorage.setItem('completed_v14', JSON.stringify(completed));
    }

    function renderAll() {
        const searchVal = document.getElementById('searchDate').value;
        const onBody = document.querySelector('#ongoingTable tbody');
        onBody.innerHTML = ongoing.map(t => `
            <tr>
                <td><strong>${formatDateDisplay(t.date)}</strong> <button class="btn-done" onclick="markDone(${t.id})">DONE</button></td>
                <td style="color:#764ba2; font-weight:600;">${t.startTime}</td>
                <td><b>${t.ticket}</b></td>
                <td>${t.area}</td>
                <td><span class="badge bg-${t.person.toLowerCase()}">${t.person}</span></td>
                <td class="status-working">${t.remarks}</td>
            </tr>
        `).join('') || '<tr><td colspan="6" align="center" style="padding:20px;">No Active Work</td></tr>';

        const filtered = searchVal ? completed.filter(t => t.date === searchVal) : completed;
        document.querySelector('#completedTable tbody').innerHTML = filtered.map(t => `
            <tr>
                <td><strong>${formatDateDisplay(t.date)}</strong></td>
                <td>${t.startTime}</td>
                <td style="color:#00b09b; font-weight:600;">${t.doneTime}</td>
                <td><b>${t.ticket}</b></td>
                <td>${t.area}</td>
                <td><span class="badge bg-${t.person.toLowerCase()}">${t.person}</span></td>
                <td style="color:#00b09b; font-weight:700;">Done</td>
            </tr>
        `).join('') || '<tr><td colspan="7" align="center" style="padding:20px;">No Records Found</td></tr>';
    }
</script>
</body>
</html>
