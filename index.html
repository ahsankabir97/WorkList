<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work Assigned Dashboard | Modern UI</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --success-gradient: linear-gradient(135deg, #00b09b 0%, #96c93d 100%);
            --danger-gradient: linear-gradient(135deg, #ff5f6d 0%, #ffc371 100%);
            --ongoing-gradient: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            --bg-color: #f8f9fd;
            --white: #ffffff;
            --radius: 16px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Poppins', sans-serif; 
            background-color: var(--bg-color); 
            padding: 20px;
            color: #2d3436;
        }
        .container { max-width: 1200px; margin: 0 auto; }

        header {
            background: var(--primary-gradient);
            padding: 30px; border-radius: var(--radius); color: white;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 10px 30px rgba(118, 75, 162, 0.3); margin-bottom: 25px;
        }

        .card { 
            background: var(--white); 
            border-radius: var(--radius); 
            padding: 25px; 
            margin-bottom: 25px; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.04);
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(0,0,0,0.05);
        }

        .card-new { border-top: 6px solid #667eea; }
        .card-ongoing { border-top: 6px solid #f5576c; }
        .card-completed { border-top: 6px solid #00b09b; }

        .card-header { 
            font-weight: 700; 
            font-size: 1.1rem;
            margin-bottom: 20px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }

        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; align-items: end; }
        .input-group { display: flex; flex-direction: column; gap: 8px; }
        label { font-size: 0.85rem; font-weight: 600; color: #636e72; }
        input, select { 
            padding: 12px; 
            border: 2px solid #edf2f7; 
            border-radius: 10px; 
            outline: none; 
            font-family: inherit; 
            transition: 0.3s;
            background: #fdfdfd;
        }
        input:focus, select:focus { border-color: #667eea; background: #fff; }

        .btn-assign { 
            background: var(--primary-gradient); 
            color: white; 
            border: none; 
            padding: 14px; 
            border-radius: 10px; 
            font-weight: 700; 
            cursor: pointer; 
            text-transform: uppercase; 
            transition: all 0.4s; 
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        .btn-assign:hover { 
            transform: scale(1.02);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
            filter: brightness(1.1);
        }
        .btn-assign:active { transform: scale(0.98); }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { text-align: left; padding: 15px; background: #f1f4f8; font-size: 0.75rem; color: #7f8c8d; text-transform: uppercase; letter-spacing: 1px; }
        td { padding: 15px; border-bottom: 1px solid #f1f2f6; font-size: 0.9rem; font-weight: 400; }

        .badge { padding: 6px 14px; border-radius: 30px; font-weight: 600; color: white; font-size: 0.8rem; display: inline-block; }
        .bg-sumon { background: #20bf6b; } .bg-alamin { background: #f0932b; }
        .bg-nahid { background: #eb4d4b; } .bg-fahim { background: #5f27cd; }

        .status-working { color: #f5576c; font-weight: 700; animation: blink 1.5s infinite; }
        .status-done { color: #00b09b; font-weight: 700; }
        @keyframes blink { 50% { opacity: 0.4; } }

        .btn-done { 
            background: var(--success-gradient); 
            color: white; 
            border: none; 
            padding: 8px 18px; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: 600; 
            transition: 0.3s;
        }
        .btn-done:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(0, 176, 155, 0.3); }

        .search-box { padding: 8px 12px; border: 2px solid #00b09b; border-radius: 10px; font-size: 0.85rem; }
        .btn-clear { background: var(--danger-gradient); color: white; border: none; padding: 10px 18px; border-radius: 10px; cursor: pointer; font-weight: 600; transition: 0.3s; }
        .flex-row { display: flex; gap: 12px; align-items: center; }

        @media (max-width: 768px) {
            header { flex-direction: column; gap: 15px; text-align: center; }
            .form-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1 style="letter-spacing: -1px;">WORK DASHBOARD</h1>
        <div id="liveClock" style="font-weight: 600; font-size: 1.4rem; background: rgba(255,255,255,0.2); padding: 5px 15px; border-radius: 10px;"></div>
    </header>

    <div class="card card-new">
        <div class="card-header" style="color: #667eea;">🚀 Create New Assignment</div>
        <div class="form-grid">
            <div class="input-group">
                <label>Assignment Date</label>
                <input type="date" id="dateInput" onchange="updateTicketPrefix()">
            </div>
            <div class="input-group">
                <label>Ticket ID</label>
                <input type="text" id="ticketInput" placeholder="L3-DDMonYY-">
            </div>
            <div class="input-group">
                <label>Select Area</label>
                <select id="areaInput">
                    <option value="">Select Area</option>
                    <option value="Aganagar">Aganagar</option>
                    <option value="Babubazar">Babubazar</option>
                    <option value="Bangshal">Bangshal</option>
                    <option value="Chawkbazar">Chawkbazar</option>
                    <option value="Dhalpur">Dhalpur</option>
                    <option value="Donia">Donia</option>
                    <option value="Eskaton">Eskaton</option>
                    <option value="Ganderia">Ganderia</option>
                    <option value="Gulistan">Gulistan</option>
                    <option value="Imamganj">Imamganj</option>
                    <option value="Islampur">Islampur</option>
                    <option value="Jatrabari">Jatrabari</option>
                    <option value="Jurain">Jurain</option>
                    <option value="Kakrail">Kakrail</option>
                    <option value="Kamlapur">Kamlapur</option>
                    <option value="Keraniganj">Keraniganj</option>
                    <option value="Lalbagh">Lalbagh</option>
                    <option value="Matuail">Matuail</option>
                    <option value="Mitford">Mitford</option>
                    <option value="Moghbazar">Moghbazar</option>
                    <option value="Motijheel">Motijheel</option>
                    <option value="Moulovibazar">Moulovibazar</option>
                    <option value="Rajarbag">Rajarbag</option>
                    <option value="Ramna">Ramna</option>
                    <option value="RK Mission Road">RK Mission Road</option>
                    <option value="SadarGhat">SadarGhat</option>
                    <option value="SanirAkhra">SanirAkhra</option>
                    <option value="Segunbagicha">Segunbagicha</option>
                    <option value="Shahjahanpur">Shahjahanpur</option>
                    <option value="Shantinagar">Shantinagar</option>
                    <option value="Shyampur">Shyampur</option>
                    <option value="Tikatuli">Tikatuli</option>
                    <option value="Wari">Wari</option>
                </select>
            </div>
            <div class="input-group">
                <label>Field Staff</label>
                <select id="personInput">
                    <option value="">Assign to...</option>
                    <option value="Sumon">Sumon</option>
                    <option value="Alamin">Alamin</option>
                    <option value="Nahid">Nahid</option>
                    <option value="Fahim">Fahim</option>
                </select>
            </div>
            <button class="btn-assign" id="assignBtn" onclick="addTask()">Assign Now</button>
        </div>
    </div>

    <div class="card card-ongoing">
        <div class="card-header" style="color: #f5576c;">⏳ Ongoing Tasks (Working)</div>
        <div style="overflow-x:auto;">
            <table id="ongoingTable">
                <thead>
                    <tr><th>Date</th><th>Start</th><th>Ticket ID</th><th>Area</th><th>Staff</th><th>Status</th><th>Action</th></tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <div class="card card-completed">
        <div class="card-header">
            <span style="color: #00b09b;">✅ Completed (Done Today)</span>
            <div class="flex-row">
                <input type="date" id="searchDate" class="search-box" onchange="renderAll()">
                <button class="btn-clear" onclick="clearCompleted()">Clear List</button>
            </div>
        </div>
        <div style="overflow-x:auto;">
            <table id="completedTable">
                <thead>
                    <tr><th>Date</th><th>Start</th><th>End</th><th>Ticket ID</th><th>Area</th><th>Staff</th><th>Status</th></tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const G_URL = "https://script.google.com/macros/s/AKfycbzWrSVVvXbEnOQtKSEcun6rYvdyEPXh9quLJiuVGHVnNFPsUl2iFlowa3gsk43rstD3/exec";
    
    let ongoing = JSON.parse(localStorage.getItem('ongoing_v14')) || [];
    let completed = JSON.parse(localStorage.getItem('completed_v14')) || [];

    document.addEventListener('DOMContentLoaded', () => {
        const today = new Date();
        document.getElementById('dateInput').valueAsDate = today;
        updateTicketPrefix();
        renderAll();
        setInterval(() => { document.getElementById('liveClock').innerText = new Date().toLocaleTimeString(); }, 1000);
    });

    function updateTicketPrefix() {
        const dateVal = document.getElementById('dateInput').value;
        if(!dateVal) return;
        const d = new Date(dateVal);
        const day = d.getDate();
        const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
        const month = months[d.getMonth()];
        const year = d.getFullYear().toString().substr(-2);
        document.getElementById('ticketInput').value = `L3-${day}${month}${year}-`;
    }

    async function addTask() {
        const btn = document.getElementById('assignBtn');
        const date = document.getElementById('dateInput').value;
        const ticket = document.getElementById('ticketInput').value;
        const area = document.getElementById('areaInput').value;
        const person = document.getElementById('personInput').value;
        const startTime = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

        if(!ticket || !area || !person) return alert("Please fill all fields!");

        const task = { date, ticket, area, person, startTime, remarks: "Working", id: Date.now() };
        btn.innerText = "Syncing..."; btn.disabled = true;

        try {
            await fetch(G_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(task) });
            ongoing.push(task);
            saveData(); renderAll();
            updateTicketPrefix();
        } catch(e) { alert("Sync Failed!"); }
        finally { btn.innerText = "Assign Now"; btn.disabled = false; }
    }

    async function markDone(id, btn) {
        const idx = ongoing.findIndex(t => t.id === id);
        if (idx === -1) return;
        const doneTime = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        const task = {...ongoing[idx], doneTime, remarks: "Done"};
        btn.innerText = "...";
        try {
            await fetch(G_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(task) });
            const doneTask = ongoing.splice(idx, 1)[0];
            doneTask.doneTime = doneTime; doneTask.remarks = "Done";
            completed.unshift(doneTask);
            saveData(); renderAll();
        } catch(e) { alert("Error updating!"); }
    }

    function clearCompleted() {
        if(confirm("Confirm clear list?")) { completed = []; saveData(); renderAll(); }
    }

    function saveData() {
        localStorage.setItem('ongoing_v14', JSON.stringify(ongoing));
        localStorage.setItem('completed_v14', JSON.stringify(completed));
    }

    function renderAll() {
        const searchVal = document.getElementById('searchDate').value;
        const onBody = document.querySelector('#ongoingTable tbody');
        onBody.innerHTML = ongoing.map(t => `
            <tr>
                <td>${t.date}</td>
                <td style="color:#764ba2; font-weight:600;">${t.startTime}</td>
                <td><b style="color:#2d3436;">${t.ticket}</b></td>
                <td>${t.area}</td>
                <td><span class="badge bg-${t.person.toLowerCase()}">${t.person}</span></td>
                <td class="status-working">${t.remarks}</td>
                <td><button class="btn-done" onclick="markDone(${t.id}, this)">Done</button></td>
            </tr>
        `).join('') || '<tr><td colspan="7" align="center" style="padding:40px; color:#b2bec3;">No Active Work Found</td></tr>';

        const filtered = searchVal ? completed.filter(t => t.date === searchVal) : completed;
        const comBody = document.querySelector('#completedTable tbody');
        comBody.innerHTML = filtered.map(t => `
            <tr>
                <td>${t.date}</td>
                <td>${t.startTime}</td>
                <td style="color:#00b09b; font-weight:600;">${t.doneTime}</td>
                <td><b>${t.ticket}</b></td>
                <td>${t.area}</td>
                <td><span class="badge bg-${t.person.toLowerCase()}">${t.person}</span></td>
                <td class="status-done">${t.remarks}</td>
            </tr>
        `).join('') || '<tr><td colspan="7" align="center" style="padding:40px; color:#b2bec3;">No Records Found</td></tr>';
    }
</script>
</body>
</html>
