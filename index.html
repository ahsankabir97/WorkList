<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work Assigned Dashboard | Premium</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Trebuchet MS', sans-serif; font-weight: bold; }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #2d3436;
        }

        .container { max-width: 1100px; margin: 0 auto; }

        /* Header Style */
        header {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            padding: 20px 30px;
            border-radius: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            margin-bottom: 25px;
        }

        header h1 { font-size: 1.6rem; text-transform: uppercase; letter-spacing: 2px; text-shadow: 2px 2px 4px rgba(0,0,0,0.2); }
        #liveClock { background: #fff; color: #764ba2; padding: 5px 15px; border-radius: 50px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }

        /* Glass Card */
        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .card-title {
            font-size: 1.1rem;
            color: #4834d4;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            text-transform: uppercase;
        }

        /* Form Grid */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            align-items: end;
        }

        .input-group label { display: block; margin-bottom: 8px; font-size: 0.85rem; color: #4b6584; }

        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #d1d8e0;
            border-radius: 10px;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            outline: none;
            background: #f8f9fa;
        }

        input:focus, select:focus { border-color: #764ba2; background: #fff; box-shadow: 0 0 10px rgba(118, 75, 162, 0.2); }

        .btn-assign {
            background: linear-gradient(to right, #6c5ce7, #a29bfe);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.3s;
            box-shadow: 0 5px 15px rgba(108, 92, 231, 0.4);
        }

        .btn-assign:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(108, 92, 231, 0.6); }

        /* Modern Table */
        .table-wrapper { overflow-x: auto; border-radius: 12px; }
        table { width: 100%; border-collapse: collapse; background: white; }
        th { background: #f1f2f6; padding: 15px; font-size: 0.8rem; text-transform: uppercase; color: #747d8c; border-bottom: 3px solid #dfe4ea; }
        td { padding: 15px; border-bottom: 1px solid #f1f2f6; font-size: 0.9rem; }

        /* Person Badges */
        .badge { padding: 6px 12px; border-radius: 8px; font-size: 0.8rem; color: white; display: inline-block; }
        .bg-sumon { background: #26de81; }
        .bg-alamin { background: #fd9644; }
        .bg-nahid { background: #eb4d4b; }
        .bg-fahim { background: #fed330; color: #2d3436; }

        .status-working { color: #f0932b; font-size: 0.85rem; display: flex; align-items: center; gap: 5px; }
        .status-working::before { content: ''; width: 8px; height: 8px; background: #f0932b; border-radius: 50%; display: inline-block; animation: pulse 1s infinite; }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

        .btn-done {
            background: #20bf6b;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-done:hover { background: #26de81; transform: scale(1.05); }

    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>WORK ASSIGNED DASHBOARD</h1>
        <div id="liveClock">00:00:00</div>
    </header>

    <div class="glass-card">
        <div class="card-title">✨ Create New Task</div>
        <div class="form-grid">
            <div class="input-group">
                <label>Assigned Date</label>
                <input type="date" id="dateInput">
            </div>
            <div class="input-group">
                <label>Ticket ID</label>
                <input type="text" id="ticketInput" placeholder="Enter ID...">
            </div>
            <div class="input-group">
                <label>Select Area</label>
                <select id="areaInput">
                     <option value="">Select Area</option>
                    <option value="Motijheel">Motijheel</option>
                    <option value="Segunbagicha">Segunbagicha</option>
                    <option value="Eskaton">Eskaton</option>
                    <option value="Moghbazar">Moghbazar</option>
                    <option value="Wari">Wari</option>
                    <option value="RK Mission Road">RK Mission Road</option>
                    <option value="Chawkbazar">Chawkbazar</option>
                    <option value="Shantinagar">Shantinagar</option>
                    <option value="SadarGhat">SadarGhat</option>
                    <option value="Gulistan">Gulistan</option>
                    <option value="Rajarbag">Rajarbag</option>
                    <option value="Moulovibazar">Moulovibazar</option>
                    <option value="Islampur">Islampur</option>
                    <option value="Imamganj">Imamganj</option>
                    <option value="Jatrabari">Jatrabari</option>
                    <option value="Lalbagh">Lalbagh</option>
                    <option value="SanirAkhra">SanirAkhra</option>
                    <option value="Keraniganj">Keraniganj</option>
                    <option value="Aganagar">Aganagar</option>
                    <option value="Jurain">Jurain</option>
                    <option value="Dhalpur">Dhalpur</option>
                    <option value="Ganderia">Ganderia</option>
                    <option value="Kamlapur">Kamlapur</option>
                    <option value="Tikatuli">Tikatuli</option>
                    <option value="Bangshal">Bangshal</option>
                    <option value="Ramna">Ramna</option>
                    <option value="Mitford">Mitford</option>
                    <option value="Shahjahanpur">Shahjahanpur</option>
                    <option value="Matuail">Matuail</option>
                    <option value="Shyampur">Shyampur</option>
                    <option value="Donia">Donia</option>
                    <option value="Babubazar">Babubazar</option>
                </select>
            </div>
            <div class="input-group">
                <label>Field Staff</label>
                <select id="personInput">
		<option value="">Select Staff</option>
                    <option value="Sumon">Sumon</option>
                    <option value="Alamin">Alamin</option>
                    <option value="Nahid">Nahid</option>
                    <option value="Fahim">Fahim</option>
                </select>
            </div>
            <button class="btn-assign" id="assignBtn" onclick="addTask()">Assign Task</button>
        </div>
    </div>

    <div class="glass-card">
        <div class="card-title" style="color: #f0932b;">⏳ Current Active Works</div>
        <div class="table-wrapper">
            <table id="ongoingTable">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Start Time</th>
                        <th>Ticket ID</th>
                        <th>Location</th>
                        <th>Assigned To</th>
                        <th>Current Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const G_URL = "https://script.google.com/macros/s/AKfycbzWrSVVvXbEnOQtKSEcun6rYvdyEPXh9quLJiuVGHVnNFPsUl2iFlowa3gsk43rstD3/exec";
    let ongoing = JSON.parse(localStorage.getItem('tasks_v14')) || [];

    document.addEventListener('DOMContentLoaded', () => {
        render();
        setInterval(() => { document.getElementById('liveClock').innerText = new Date().toLocaleTimeString(); }, 1000);
        document.getElementById('dateInput').valueAsDate = new Date();
    });

    async function addTask() {
        const btn = document.getElementById('assignBtn');
        const date = document.getElementById('dateInput').value;
        const ticket = document.getElementById('ticketInput').value;
        const area = document.getElementById('areaInput').value;
        const person = document.getElementById('personInput').value;
        const startTime = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'});

        if(!ticket) return alert("Please enter Ticket ID");

        const task = { date, ticket, area, person, startTime, remarks: "Working" };
        btn.innerText = "Syncing...";
        btn.disabled = true;

        try {
            await fetch(G_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(task) });
            ongoing.push({ ...task, id: Date.now() });
            localStorage.setItem('tasks_v14', JSON.stringify(ongoing));
            render();
            document.getElementById('ticketInput').value = '';
        } catch(e) {
            alert("Sync Failed!");
        } finally {
            btn.innerText = "Assign Task";
            btn.disabled = false;
        }
    }

    async function markDone(id, btn) {
        const idx = ongoing.findIndex(t => t.id === id);
        const doneTime = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'});
        const task = {...ongoing[idx], doneTime, remarks: "Done"};

        btn.innerText = "...";
        try {
            await fetch(G_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(task) });
            ongoing.splice(idx, 1);
            localStorage.setItem('tasks_v14', JSON.stringify(ongoing));
            render();
        } catch(e) {
            alert("Error updating!");
        }
    }

    function render() {
        const body = document.querySelector('#ongoingTable tbody');
        body.innerHTML = ongoing.map(t => `
            <tr>
                <td>${t.date}</td>
                <td style="color:#764ba2;">${t.startTime}</td>
                <td><span style="background:#f1f2f6; padding:4px 8px; border-radius:5px;">${t.ticket}</span></td>
                <td>${t.area}</td>
                <td><span class="badge bg-${t.person.toLowerCase()}">${t.person}</span></td>
                <td class="status-working">${t.remarks}</td>
                <td><button class="btn-done" onclick="markDone(${t.id}, this)">Done</button></td>
            </tr>
        `).join('') || '<tr><td colspan="7" align="center" style="padding:30px; color:#999;">No Active Work Found</td></tr>';
    }
</script>
</body>
</html>
