<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="60"> 
    <title>Work Assigned Dashboard | Link3 Technologies</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Montserrat:wght@600;700;800&family=Outfit:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --success-gradient: linear-gradient(135deg, #00b09b 0%, #96c93d 100%);
            --danger-gradient: linear-gradient(135deg, #ff5f6d 0%, #ffc371 100%);
            --company-gradient: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            --bg-color: #f8f9fd;
            --white: #ffffff;
            --radius: 16px;
            --shadow: 0 8px 25px rgba(0, 0, 0, 0.06);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Outfit', sans-serif; 
            background-color: var(--bg-color); 
            padding: 15px; 
            color: #2d3436;
            background: linear-gradient(135deg, #f8f9fd 0%, #eef2f7 100%);
            min-height: 100vh;
            font-size: 14px;
        }
        .container { 
            max-width: 1000px; 
            margin: 0 auto; 
            transform: scale(0.95);
            transform-origin: top center;
        }

         /* আকর্ষণীয় হেডার ডিজাইন - ছোট সাইজ */
        header {
            background: var(--primary-gradient);
            padding: 15px 25px;
            border-radius: var(--radius);
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow);
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        header::before {
            content: '';
            position: absolute;
            top: -40%;
            right: -15%;
            width: 150px;
            height: 150px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
        }

        header::after {
            content: '';
            position: absolute;
            bottom: -30%;
            left: -8%;
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 50%;
        }

        .header-left {
            position: relative;
            z-index: 2;
        }

        .main-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.1rem;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 3px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
            background: linear-gradient(135deg, #ffffff 0%, #e6e6ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .company-name {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.00rem;
            font-weight: 700;
            letter-spacing: 0.3px;
            color: #1725EB;
            position: relative;
            z-index: 1;
            text-shadow: 0 1px 3px rgba(0, 51, 153, 0.3), 
                         0 1px 0 rgba(255, 255, 255, 0.5);
        }

        .header-right { 
            text-align: right;
            position: relative;
            z-index: 2;
        }

        .datetime-container {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
        }

        #liveDate {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.8rem;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.9);
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }

        #liveClock {
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 0.80rem;
            background: rgba(255, 255, 255, 0.15);
            padding: 6px 14px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
            letter-spacing: 0.8px;
            color: #ffffff;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.2);
            min-width: 120px;
            text-align: center;
            margin-bottom: 3px;
        }

        /* কপিরাইট টেক্সট */
        .copyright-text {
            font-family: 'Poppins', sans-serif;
            font-size: 0.65rem;
            color: #17EB7D;
            font-weight: 500;
            letter-spacing: 0.3px;
        }


        /* কার্ড ডিজাইন */
        .card { 
            background: var(--white); 
            border-radius: var(--radius); 
            padding: 20px; 
            margin-bottom: 20px; 
            box-shadow: var(--shadow);
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(226, 232, 240, 0.8);
            transition: all 0.3s ease;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.08);
        }

        .card-title {
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 0.8rem;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px; /* আইকন এবং টেক্সটের মধ্যে ফাঁকা */
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .card-new { border-top: 5px solid #667eea; }
        .card-ongoing { border-top: 5px solid #f5576c; }
        .card-completed { border-top: 5px solid #00b09b; }

        .sheet-wrapper {
            width: 100%;
            height: 220px;
            overflow: hidden;
            border-radius: 10px;
            border: 1px solid #e2e8f0;
            background: #fff;
            position: relative;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }
        
        .sheet-wrapper iframe { 
            width: 100%; 
            height: 280px; 
            border: none; 
            position: absolute; 
            top: 0; 
            left: 0; 
        }

        /* ফর্ম স্টাইল */
        .form-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); 
            gap: 15px; 
            align-items: end; 
        }
        
        .input-group { 
            display: flex; 
            flex-direction: column; 
            gap: 8px; 
        }
        
        label { 
            font-family: 'Montserrat', sans-serif;
            font-size: 0.7rem; 
            font-weight: 700; 
            color: #4a5568; 
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        label i {
            color: #667eea;
            font-size: 0.8rem;
        }
        
        input, select { 
            padding: 12px 14px; 
            border: 2px solid #e2e8f0; 
            border-radius: 8px; 
            outline: none; 
            font-family: 'Outfit', sans-serif; 
            font-size: 0.8rem; 
            background: #fff;
            transition: all 0.2s ease;
        }

        input:focus, select:focus { 
            border-color: #667eea; 
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
        }

        /* বাটন স্টাইল */
        .btn-assign { 
            background: var(--primary-gradient); 
            color: white; 
            border: none; 
            padding: 14px; 
            border-radius: 8px; 
            font-family: 'Montserrat', sans-serif;
            font-weight: 700; 
            font-size: 0.75rem;
            cursor: pointer; 
            text-transform: uppercase; 
            letter-spacing: 0.8px;
            transition: all 0.3s ease;
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-assign:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 22px rgba(102, 126, 234, 0.35);
        }

        /* টেবিল ও অন্যান্য স্টাইল */
        table { width: 100%; border-collapse: collapse; margin-top: 12px; }
        th { text-align: left; padding: 14px 16px; background: #f7fafc; font-family: 'Montserrat', sans-serif; font-size: 0.65rem; color: #4a5568; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 2px solid #e2e8f0; }
        td { padding: 14px 16px; border-bottom: 1px solid #f1f2f6; font-size: 0.8rem; font-family: 'Outfit', sans-serif; }

        .badge { padding: 6px 12px; border-radius: 25px; font-weight: 600; color: white; font-size: 0.65rem; font-family: 'Montserrat', sans-serif; display: inline-block; text-transform: uppercase; letter-spacing: 0.3px; }
        .bg-sumon { background: linear-gradient(135deg, #20bf6b 0%, #01baef 100%); } 
        .bg-alamin { background: linear-gradient(135deg, #f0932b 0%, #f5576c 100%); }
        .bg-nahid { background: linear-gradient(135deg, #eb4d4b 0%, #d446a6 100%); } 
        .bg-fahim { background: linear-gradient(135deg, #5f27cd 0%, #341f97 100%); }

        .status-working { color: #f5576c; font-weight: 700; animation: blink 1.5s infinite; font-family: 'Montserrat', sans-serif; font-size: 0.75rem; }
        @keyframes blink { 50% { opacity: 0.4; } }

        .btn-done { background: var(--success-gradient); color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 0.65rem; margin-top: 6px; display: block; transition: all 0.2s ease; text-transform: uppercase; letter-spacing: 0.5px; box-shadow: 0 4px 10px rgba(0, 176, 155, 0.2); }
        .search-box { padding: 10px 12px; border: 2px solid #00b09b; border-radius: 8px; font-size: 0.75rem; font-family: 'Outfit', sans-serif; background: white; }
        .btn-clear { background: var(--danger-gradient); color: white; border: none; padding: 10px 18px; border-radius: 8px; cursor: pointer; font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 0.75rem; transition: all 0.3s ease; text-transform: uppercase; letter-spacing: 0.5px; box-shadow: 0 4px 12px rgba(255, 95, 109, 0.2); display: flex; align-items: center; gap: 5px; }

        /* পপআপ মেসেজ স্টাইল */
        .popup-message { position: fixed; top: 20px; right: 20px; z-index: 10000; animation: slideInRight 0.5s ease forwards; max-width: 300px; }
        .popup-content { background: linear-gradient(135deg, rgba(255, 255, 255, 0.95) 0%, rgba(248, 249, 253, 0.95) 100%); backdrop-filter: blur(15px); border-radius: 12px; padding: 16px 20px; box-shadow: 0 12px 35px rgba(0, 0, 0, 0.15); border: 1px solid rgba(255, 255, 255, 0.4); position: relative; overflow: hidden; }
        .popup-content::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: linear-gradient(90deg, #667eea 0%, #764ba2 100%); }
        .popup-success::before { background: linear-gradient(90deg, #00b09b 0%, #96c93d 100%); }
        @keyframes slideInRight { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes fadeOut { from { opacity: 1; transform: translateX(0); } to { opacity: 0; transform: translateX(100%); visibility: hidden; } }

        @media (max-width: 768px) { .container { transform: scale(1); max-width: 100%; } header { flex-direction: column; text-align: center; } .datetime-container { align-items: center; } .form-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="header-left">
            <div class="main-title">Work Dashboard</div>
            <div class="company-name">Link3 Technologies Ltd</div>
        </div>
        <div class="header-right">
            <div class="datetime-container">
                <span id="liveDate"></span>
                <span id="liveClock"></span>
                <div class="copyright-text">© Ahsanul Kabir</div>
            </div>
        </div>
    </header>

    <div class="card" style="border-top: 5px solid #4834d4;">
        <div class="card-title" style="color:#4834d4;">
            <i class="fas fa-chart-bar"></i> TASK LIVE SUMMARY
        </div>
        <div class="sheet-wrapper">
            <iframe src="https://docs.google.com/spreadsheets/d/e/2PACX-1vTYE61oI9ahQllfKmXmV-ulhGeFDi16gBDgHN8b4NWk9Y3bLyxnyc8S06Wk_TTU21YzVFj2aKKvHDJG/pubhtml?gid=337897408&single=true&widget=false&headers=false&range=A1:M7"></iframe>
        </div>
    </div>

    <div class="card card-new">
        <div class="card-title" style="color:#667eea;">
            <i class="fas fa-plus-circle"></i> CREATE NEW ASSIGNMENT
        </div>
        <div class="form-grid">
            <div class="input-group">
                <label><i class="fas fa-calendar-day"></i> Date</label>
                <input type="date" id="dateInput" onchange="handleDateChange()">
            </div>
            <div class="input-group">
                <label><i class="fas fa-hashtag"></i> Ticket ID</label>
                <input type="text" id="ticketInput" placeholder="L3-DDMonYY-">
            </div>
            <div class="input-group">
                <label><i class="fas fa-map-marker-alt"></i> Area</label>
                <select id="areaInput">
                    <option value="">Select Area</option>
                    <option value="Aganagar">Aganagar</option>
                    <option value="Babubazar">Babubazar</option>
                    <option value="Bangshal">Bangshal</option>
                    <option value="BailyRoad">BailyRoad</option>
                    <option value="Chawkbazar">Chawkbazar</option>
                    <option value="Dhalpur">Dhalpur</option>
                    <option value="Donia">Donia</option>
                    <option value="Eskaton">Eskaton</option>
                    <option value="Ganderia">Ganderia</option>
                    <option value="Gulistan">Gulistan</option>
                    <option value="Imamganj">Imamganj</option>
                    <option value="Islampur">Islampur</option>
                    <option value="Jatrabari">Jatrabari</option>
                    <option value="Jurain">Jurain</option>
                    <option value="Kakrail">Kakrail</option>
                    <option value="Kamlapur">Kamlapur</option>
                    <option value="Keraniganj">Keraniganj</option>
                    <option value="Lalbagh">Lalbagh</option>
                    <option value="Matuail">Matuail</option>
                    <option value="Malibag">Malibag</option>
                    <option value="Mitford">Mitford</option>
                    <option value="Moghbazar">Moghbazar</option>
                    <option value="Motijheel">Motijheel</option>
                    <option value="Moulovibazar">Moulovibazar</option>
                    <option value="Nawabpur">Nawabpur</option>
                    <option value="Rajarbag">Rajarbag</option>
                    <option value="Ramna">Ramna</option>
                    <option value="RK Mission Road">RK Mission Road</option>
                    <option value="SadarGhat">SadarGhat</option>
                    <option value="SanirAkhra">SanirAkhra</option>
                    <option value="Segunbagicha">Segunbagicha</option>
                    <option value="Shahjahanpur">Shahjahanpur</option>
                    <option value="Shantinagar">Shantinagar</option>
                    <option value="Shyampur">Shyampur</option>
                    <option value="Siddheshwari">Siddheshwari</option>
                    <option value="Tikatuli">Tikatuli</option>
                    <option value="Wari">Wari</option> 
                </select>
            </div>
            <div class="input-group">
                <label><i class="fas fa-user-tie"></i> Staff</label>
                <select id="personInput">
                    <option value="">Assign to...</option>
                    <option value="Sumon">Sumon</option>
                    <option value="Alamin">Alamin</option>
                    <option value="Nahid">Nahid</option>
                    <option value="Fahim">Fahim</option>
                </select>
            </div>
            <button class="btn-assign" id="assignBtn" onclick="addTask()">
                <i class="fas fa-paper-plane"></i> Assign Task
            </button>
        </div>
    </div>

    <div class="card card-ongoing">
        <div class="card-title" style="color:#f5576c;">
            <i class="fas fa-spinner fa-spin"></i> ONGOING TASKS (WORKING)
        </div>
        <div style="overflow-x:auto;">
            <table id="ongoingTable">
                <thead>
                    <tr><th>Date & Action</th><th>Start</th><th>Ticket ID</th><th>Area</th><th>Staff</th><th>Status</th></tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <div class="card card-completed">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
            <div class="card-title" style="color:#00b09b; margin-bottom: 0;">
                <i class="fas fa-check-double"></i> COMPLETED TASKS
            </div>
            <div style="display:flex; gap:10px; align-items:center;">
                <input type="date" id="searchDate" class="search-box" onchange="renderAll()">
                <button class="btn-clear" onclick="clearCompleted()">
                    <i class="fas fa-trash-alt"></i> Clear
                </button>
            </div>
        </div>
        <div style="overflow-x:auto;">
            <table id="completedTable">
                <thead>
                    <tr><th>Date</th><th>Start</th><th>End</th><th>Ticket</th><th>Area</th><th>Staff</th><th>Status</th></tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
</div>

<div id="popupContainer"></div>

<script>
    const G_URL = "https://script.google.com/macros/s/AKfycbz1ZE69wIfAem_gmCk5v-_2tH6ohSOdZoUkFpE1c0HRnQSqZxHfHVzTvVRAqjCcdB0/exec";
    let ongoing = JSON.parse(localStorage.getItem('ongoing_v14')) || [];
    let completed = JSON.parse(localStorage.getItem('completed_v14')) || [];

    function formatDateDisplay(dateStr) {
        if (!dateStr) return "";
        const parts = dateStr.split('-');
        return parts.length !== 3 ? dateStr : `${parts[2]}-${parts[1]}-${parts[0]}`;
    }

    function handleDateChange() { updateTicketPrefix(); }

    function showPopup(type, title, message) {
        const popupContainer = document.getElementById('popupContainer');
        const popupId = 'popup-' + Date.now();
        const popup = document.createElement('div');
        popup.id = popupId;
        popup.className = 'popup-message';
        const icon = type === 'success' ? '<i class="fas fa-check-circle" style="color:#00b09b; font-size:1.8rem;"></i>' : '<i class="fas fa-paper-plane" style="color:#667eea; font-size:1.8rem;"></i>';
        popup.innerHTML = `
            <div class="popup-content ${type === 'success' ? 'popup-success' : ''}">
                <button style="position:absolute; top:10px; right:10px; border:none; background:none; cursor:pointer; color:#a0aec0;" onclick="closePopup('${popupId}')">×</button>
                <div style="margin-bottom:10px;">${icon}</div>
                <div style="font-weight:700; font-size:0.9rem; color:#2d3748;">${title}</div>
                <div style="font-size:0.8rem; color:#4a5568;">${message}</div>
            </div>`;
        popupContainer.appendChild(popup);
        setTimeout(() => closePopup(popupId), 5000);
    }

    function closePopup(id) {
        const p = document.getElementById(id);
        if (p) { p.style.animation = 'fadeOut 0.5s ease forwards'; setTimeout(() => p.remove(), 500); }
    }

    document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('dateInput').valueAsDate = new Date();
        updateTicketPrefix();
        renderAll();
        setInterval(() => { 
            const now = new Date();
            document.getElementById('liveClock').innerText = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'});
            document.getElementById('liveDate').innerText = now.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
        }, 1000);
    });

    function updateTicketPrefix() {
        const d = new Date(document.getElementById('dateInput').value);
        const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
        const formattedDate = `${d.getDate()}${months[d.getMonth()]}${d.getFullYear().toString().substr(-2)}`;
        document.getElementById('ticketInput').value = `L3-${formattedDate}-`;
    }

    async function addTask() {
        const btn = document.getElementById('assignBtn');
        const task = {
            date: document.getElementById('dateInput').value,
            ticket: document.getElementById('ticketInput').value,
            area: document.getElementById('areaInput').value,
            person: document.getElementById('personInput').value,
            startTime: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
            remarks: "Working", id: Date.now()
        };
        if(!task.ticket || !task.area || !task.person) { alert("Please fill all required fields!"); return; }
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Syncing...'; btn.disabled = true;
        try {
            await fetch(G_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(task) });
            ongoing.push(task); saveData(); renderAll();
            showPopup('assign', 'Task Assigned', `${task.ticket} assigned to ${task.person}`);
        } catch(e) { alert("Sync failed!"); }
        finally { btn.innerHTML = '<i class="fas fa-paper-plane"></i> Assign Task'; btn.disabled = false; }
    }

    async function markDone(id) {
        const idx = ongoing.findIndex(t => t.id === id);
        const doneTime = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        const task = {...ongoing[idx], doneTime, remarks: "Done"};
        try {
            await fetch(G_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(task) });
            completed.unshift(ongoing.splice(idx, 1)[0]);
            completed[0].doneTime = doneTime; completed[0].remarks = "Done";
            saveData(); renderAll();
            showPopup('success', 'Task Completed', `${task.ticket} done at ${doneTime}`);
        } catch(e) { alert("Sync failed!"); }
    }

    function clearCompleted() { if(confirm("Clear all?")) { completed = []; saveData(); renderAll(); } }
    function saveData() { localStorage.setItem('ongoing_v14', JSON.stringify(ongoing)); localStorage.setItem('completed_v14', JSON.stringify(completed)); }

    function renderAll() {
        const searchVal = document.getElementById('searchDate').value;
        document.querySelector('#ongoingTable tbody').innerHTML = ongoing.map(t => `
            <tr>
                <td><strong>${formatDateDisplay(t.date)}</strong><button class="btn-done" onclick="markDone(${t.id})">✓ MARK DONE</button></td>
                <td style="color:#764ba2; font-weight:600;">${t.startTime}</td>
                <td><b>${t.ticket}</b></td>
                <td>${t.area}</td>
                <td><span class="badge bg-${t.person.toLowerCase()}">${t.person}</span></td>
                <td class="status-working">${t.remarks}</td>
            </tr>`).join('') || '<tr><td colspan="6" align="center">No Active Tasks</td></tr>';

        const filtered = searchVal ? completed.filter(t => t.date === searchVal) : completed;
        document.querySelector('#completedTable tbody').innerHTML = filtered.map(t => `
            <tr>
                <td><strong>${formatDateDisplay(t.date)}</strong></td>
                <td>${t.startTime}</td>
                <td style="color:#00b09b; font-weight:700;">${t.doneTime}</td>
                <td><b>${t.ticket}</b></td>
                <td>${t.area}</td>
                <td><span class="badge bg-${t.person.toLowerCase()}">${t.person}</span></td>
                <td style="color:#00b09b; font-weight:700;">✅ Done</td>
            </tr>`).join('') || '<tr><td colspan="7" align="center">No Completed Tasks</td></tr>';
    }
</script>
</body>
</html>
