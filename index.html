<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Technician Work Dashboard</title>
    <link rel="shortcut icon" href="technician_favicon.ico" type="image/x-icon">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Montserrat:wght@500;600;700;800&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            /* Premium Gradients */
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --success-gradient: linear-gradient(135deg, #00b09b 0%, #96c93d 100%);
            --danger-gradient: linear-gradient(135deg, #ff5f6d 0%, #ffc371 100%);
            --warning-gradient: linear-gradient(135deg, #f0932b 0%, #f5576c 100%);
            
            /* Backgrounds & Shadows */
            --bg-color: #f8f9fd;
            --card-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.05);
            --table-row-hover: rgba(224, 231, 255, 0.5);
            
            /* Radius */
            --radius: 16px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: 'Outfit', sans-serif; 
            background-color: var(--bg-color); 
            color: #2d3436;
            min-height: 100vh;
            font-size: 14px;
            padding: 15px;
            background: linear-gradient(135deg, #f8f9fd 0%, #eef2f7 100%);
        }

        .container { 
            max-width: 1000px; 
            margin: 0 auto; 
            transform: scale(0.95);
            transform-origin: top center;
            padding-bottom: 40px;
        }

        /* --- Header Design (Original Font Sizes Applied) --- */
        header {
            background: var(--primary-gradient);
            padding: 15px 25px; 
            border-radius: var(--radius);
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        header::before {
            content: '';
            position: absolute;
            top: -40%;
            right: -15%;
            width: 150px;
            height: 150px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
        }

        header::after {
            content: '';
            position: absolute;
            bottom: -30%;
            left: -8%;
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 50%;
        }

        .header-left {
            position: relative;
            z-index: 2;
            display: flex; 
            align-items: center;
            gap: 15px;
        }

        .company-logo {
            height: 60px; 
            width: 70px;
            display: block;
        }

        .main-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.1rem; 
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 3px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
            background: linear-gradient(135deg, #ffffff 0%, #e6e6ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .company-name {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.95rem; 
            font-weight: 700;
            letter-spacing: 0.3px;
            color: #40E0D0;
            position: relative;
            z-index: 1;
            text-shadow: 0 1px 3px rgba(0, 51, 153, 0.3), 
                         0 1px 0 rgba(255, 255, 255, 0.5);
            display: block;
        }

        .header-right { 
            text-align: right;
            position: relative;
            z-index: 2;
        }

        .datetime-container {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
        }

        #liveDate {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.8rem; 
            font-weight: 500;
            color: rgba(255, 255, 255, 0.9);
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }

        #liveClock {
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 0.80rem; 
            background: rgba(255, 255, 255, 0.15);
            padding: 6px 14px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
            letter-spacing: 0.8px;
            color: #ffffff;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.2);
            min-width: 120px;
            text-align: center;
        }

        .sync-status {
            font-size: 0.6rem;
            color: rgba(255,255,255,0.7);
            margin-top: 4px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 5px;
        }

        .sync-indicator {
            width: 6px;
            height: 6px;
            background-color: #4ade80;
            border-radius: 50%;
            box-shadow: 0 0 5px #4ade80;
        }
        
        .sync-indicator.updating {
            background-color: #facc15;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.5); opacity: 0.5; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* --- Cards & Table --- */
        .card { 
            background: #ffffff; 
            border-radius: var(--radius); 
            padding: 20px; 
            margin-bottom: 20px; 
            box-shadow: var(--card-shadow);
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(226, 232, 240, 0.8);
            transition: all 0.3s ease;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
        }

        .card-title {
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 0.8rem;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #4a5568;
            border-bottom: 2px solid #f3f4f6;
            padding-bottom: 10px;
        }

        .card-new { border-top: 5px solid #667eea; }
        .card-ongoing { border-top: 5px solid #f5576c; }
        .card-completed { border-top: 5px solid #00b09b; }

        .sheet-wrapper {
            width: 100%;
            height: 220px;
            overflow: hidden;
            border-radius: 10px;
            border: 1px solid #e2e8f0;
            background: #fff;
            position: relative;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }
        
        .sheet-wrapper iframe { 
            width: 100%; 
            height: 280px; 
            border: none; 
            position: absolute; 
            top: 0; 
            left: 0; 
        }

        /* --- Form Design --- */
        .form-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); 
            gap: 15px; 
            align-items: end; 
        }
        
        .input-group { 
            display: flex; 
            flex-direction: column; 
            gap: 8px; 
        }
        
        label { 
            font-family: 'Montserrat', sans-serif;
            font-size: 0.7rem; 
            font-weight: 700; 
            color: #4a5568; 
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        input, select { 
            padding: 12px 14px; 
            border: 2px solid #e2e8f0; 
            border-radius: 8px; 
            outline: none; 
            font-family: 'Outfit', sans-serif; 
            font-size: 0.8rem; 
            background: #fff;
            transition: all 0.2s ease;
        }

        input:focus, select:focus { 
            border-color: #667eea; 
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
        }

        /* --- Buttons --- */
        .btn-assign { 
            background: var(--primary-gradient); 
            color: white; 
            border: none; 
            padding: 14px; 
            border-radius: 8px; 
            font-family: 'Montserrat', sans-serif;
            font-weight: 700; 
            font-size: 0.75rem;
            cursor: pointer; 
            text-transform: uppercase; 
            letter-spacing: 0.8px;
            transition: all 0.3s ease;
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-assign:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.35);
        }

        .btn-assign:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* --- Table Design --- */
        table { 
            width: 100%; 
            border-collapse: collapse; 
            margin-top: 12px;
            background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.08);
            border: 1px solid rgba(224, 231, 255, 0.5);
        }
        
        th { 
            text-align: left; 
            padding: 14px 16px; 
            background: linear-gradient(135deg, #e6f0ff 0%, #e0e7ff 100%); 
            font-family: 'Montserrat', sans-serif;
            font-size: 0.65rem; 
            color: #4a5568; 
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 2px solid rgba(102, 126, 234, 0.2);
            position: relative;
        }

        th:not(:last-child)::after {
            content: '';
            position: absolute;
            right: 0;
            top: 25%;
            height: 50%;
            width: 1px;
            background: rgba(102, 126, 234, 0.2);
        }
        
        td { 
            padding: 14px 16px; 
            border-bottom: 1px solid rgba(224, 231, 255, 0.4); 
            font-size: 0.8rem; 
            font-family: 'Outfit', sans-serif;
            background: rgba(255, 255, 255, 0.8);
            transition: all 0.2s ease;
        }

        tr:hover td {
            background: var(--table-row-hover);
            transform: translateX(2px);
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:nth-child(even) td {
            background: rgba(248, 250, 252, 0.9);
        }

        tr:nth-child(even):hover td {
            background: var(--table-row-hover);
        }

        /* --- Badges --- */
        .badge { 
            padding: 6px 12px; 
            border-radius: 25px; 
            font-weight: 600; 
            color: white; 
            font-size: 0.65rem;
            font-family: 'Montserrat', sans-serif;
            display: inline-block;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            width: fit-content;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .bg-sumon { background: linear-gradient(135deg, #20bf6b 0%, #01baef 100%); } 
        .bg-alamin { background: linear-gradient(135deg, #f0932b 0%, #f5576c 100%); }
        .bg-nahid { background: linear-gradient(135deg, #eb4d4b 0%, #d446a6 100%); } 
        .bg-fahim { background: linear-gradient(135deg, #5f27cd 0%, #341f97 100%); }

        /* --- Status & Action --- */
        .status-working { 
            color: #f5576c; 
            font-weight: 700; 
            animation: blink 1.5s infinite; 
            font-family: 'Montserrat', sans-serif;
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            background: rgba(245, 87, 108, 0.1);
            border-radius: 6px;
            width: fit-content;
        }
        
        @keyframes blink { 
            50% { opacity: 0.4; } 
        }

        .btn-done { 
            background: var(--success-gradient); 
            color: white; 
            border: none; 
            padding: 8px 14px; 
            border-radius: 6px; 
            cursor: pointer; 
            font-family: 'Montserrat', sans-serif;
            font-weight: 700; 
            font-size: 0.65rem; 
            margin-top: 6px; 
            display: inline-flex;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 10px rgba(0, 176, 155, 0.2);
            align-items: center;
            gap: 5px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-done:hover {
            transform: translateY(-1px);
            box-shadow: 0 5px 12px rgba(0, 176, 155, 0.3);
        }

        /* --- Search & Clear --- */
        .search-box { 
            padding: 10px 12px; 
            border: 2px solid #00b09b; 
            border-radius: 8px; 
            font-size: 0.75rem; 
            font-family: 'Outfit', sans-serif;
            background: white;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 2px 8px rgba(0, 176, 155, 0.1);
        }
        
        .btn-clear { 
            background: var(--danger-gradient); 
            color: white; 
            border: none; 
            padding: 10px 18px; 
            border-radius: 8px; 
            cursor: pointer; 
            font-family: 'Montserrat', sans-serif;
            font-weight: 700; 
            font-size: 0.75rem; 
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 12px rgba(255, 95, 109, 0.2);
            display: flex;
            align-items: center;
            gap: 6px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-clear:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(255, 95, 109, 0.3);
        }

        /* --- Popup System --- */
        .popup-message {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 10000;
            animation: slideInRight 0.5s ease forwards;
            max-width: 300px;
        }

        .popup-content {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.95) 0%, rgba(248, 249, 253, 0.95) 100%);
            backdrop-filter: blur(15px);
            border-radius: 12px;
            padding: 16px 20px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.4);
            position: relative;
            overflow: hidden;
        }

        .popup-content::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
        }

        .popup-content.warning::before { background: linear-gradient(90deg, #ffa726 0%, #ff9800 100%); }
        .popup-content.success::before { background: linear-gradient(90deg, #00b09b 0%, #96c93d 100%); }
        .popup-content.info::before { background: #3b82f6; }

        .popup-icon {
            font-size: 1.5rem;
            margin-bottom: 8px;
            display: inline-block;
        }

        .popup-title {
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 0.85rem;
            color: #2d3748;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .popup-text {
            font-family: 'Outfit', sans-serif;
            font-size: 0.8rem;
            color: #4a5568;
            line-height: 1.4;
            margin-left: 28px;
        }

        .popup-close {
            position: absolute;
            top: 10px;
            right: 10px;
            background: none;
            border: none;
            color: #a0aec0;
            font-size: 1rem;
            cursor: pointer;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .popup-close:hover {
            background: rgba(0, 0, 0, 0.05);
            color: #718096;
        }

        @keyframes slideInRight {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes fadeOut {
            from { opacity: 1; transform: translateX(0); }
            to { opacity: 0; transform: translateX(100%); visibility: hidden; }
        }

        .copyright-text {
            font-family: 'Poppins', sans-serif;
            font-size: 0.65rem;
            color: #155DFC; 
            font-weight: 600;
            letter-spacing: 0.3px;
            text-align: left; 
            margin-top: 9px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            body { padding: 10px; }
            .container { transform: scale(1); max-width: 100%; }
            header { flex-direction: column; gap: 15px; text-align: center; padding: 15px; }
            .header-left { flex-direction: column; text-align: center; }
            .header-right { text-align: center; width: 100%; }
            .datetime-container { align-items: center; }
            .form-grid { grid-template-columns: 1fr; }
            .card { padding: 16px; }
            #liveClock { min-width: 110px; }
            .popup-message { top: 10px; right: 10px; left: 10px; max-width: none; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Header -->

        <div class="header-left">
            <img src="https://z-cdn-media.chatglm.cn/files/acb00912-a376-4782-b313-80248fd0f8ed.png?auth_key=1870834439-20e10467e7154c949132c6f76f1a421e-0-71eb8030909b232371f257313e5acc97" alt="Link3 Logo" class="company-logo">
            <div>
                <div class="main-title">Work Dashboard</div>

        <div class="header-right">

    <!-- Live Summary -->

        </div>
        <div class="copyright-text">© Ahsanul Kabir</div>
    </div>

                    <option value="Bangshal">Bangshal</option>

                    <option value="Chawkbazar">Chawkbazar</option>
                    <option value="Dhalpur">Dhalpur</option>

                    <option value="Ganderia">Ganderia</option>
                    <option value="Gulistan">Gulistan</option>
                    <option value="Imamganj">Imamganj</option>
                    <option value="Islampur">Islampur</option>
                    <option value="Jatrabari">Jatrabari</option>
            	    <option value="Joypara">Joypara</option>
                    <option value="Jurain">Jurain</option>

                    <option value="Moghbazar">Moghbazar</option>
                    <option value="Motijheel">Motijheel</option>
                    <option value="Moulovibazar">Moulovibazar</option>

                    <option value="Purana Paltan">Purana Paltan</option>
                    <option value="Naya Paltan">Naya Paltan</option>
                    <option value="Rajarbag">Rajarbag</option>
                    <option value="Ramna">Ramna</option>
                    <option value="RK Mission Road">RK Mission</option>
                    <option value="SadarGhat">SadarGhat</option>

            </div>
            <div class="input-group">
                <label><i class="fas fa-user"></i> Staff</label>

                    <option value="">Assign to...</option>

    <!-- Ongoing Tasks -->
    <div class="card card-ongoing">
        <div class="card-title" style="color:#f5576c;"><i class="fas fa-spinner fa-pulse"></i> ONGOING TASKS (WORKING)</div>
        <div style="overflow-x:auto;">
            <table id="ongoingTable">
                <thead>
                    <tr><th>Date & Action</th><th>Start</th><th>Ticket ID</th><th>Area</th><th>Staff</th><th>Status</th></tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <!-- Completed Tasks -->
    <div class="card card-completed">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
            <div class="card-title" style="color:#00b09b; margin:0; padding:0; border:none;"><i class="fas fa-check-circle"></i> COMPLETED TASKS</div>
            <div style="display:flex; gap:10px; align-items:center;">
                <input type="date" id="searchDate" class="search-box" onchange="renderAll()" placeholder="Filter by date">
                <button class="btn-clear" onclick="clearCompleted()">
                    <i class="fas fa-trash-alt"></i> Clear
                </button>
            </div>
        </div>
        <div style="overflow-x:auto;">
            <table id="completedTable">
                <thead>
                    <tr><th>Date</th><th>Start</th><th>End</th><th>Ticket</th><th>Area</th><th>Staff</th><th>Status</th></tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
</div>

<!-- Popup Container -->
<div id="popupContainer"></div>

<script>
    const G_URL = "https://script.google.com/macros/s/AKfycbz1ZE69wIfAem_gmCk5v-_2tH6ohSOdZoUkFpE1c0HRnQSqZxHfHVzTvVRAqjCcdB0/exec";
    
    // Local State
    let ongoing = JSON.parse(localStorage.getItem('ongoing_v15')) || [];
    let completed = JSON.parse(localStorage.getItem('completed_v15')) || [];
    let isSyncing = false;

    // --- UPDATED Ticket Validation Logic (3 Formats) ---
    function validateTicketID(ticket) {
        // Format 1: L3-22Feb26-030306
        const patternL3 = /^L3-\d{2}[A-Za-z]{3}\d{2}-\d+$/;

        // Format 2: TKI011225AA67000218 (TKI + 6 digits + 2 letters + 8 digits)
        const patternTKI = /^TKI\d{6}[A-Za-z]{2}\d{8}$/;

        // Format 3: CR-23Feb26-0176371
        const patternCR = /^CR-\d{2}[A-Za-z]{3}\d{2}-\d+$/;

        // Check if ticket matches ANY of the 3 patterns
        return patternL3.test(ticket) || patternTKI.test(ticket) || patternCR.test(ticket);
    }

    // --- Data Formatting ---
    function formatDateDisplay(dateStr) {
        if (!dateStr) return "";
        const parts = dateStr.split('-');
        if (parts.length !== 3) return dateStr;
        return `${parts[2]}-${parts[1]}-${parts[0]}`;
    }

    // --- Popup System ---
    function showPopup(type, title, message) {
        const popupContainer = document.getElementById('popupContainer');
        const popupId = 'popup-' + Date.now();
        
        let icon = '';
        if (type === 'success') icon = '<i class="fas fa-check-circle" style="color:var(--success-gradient)"></i>';
        else if (type === 'warning') icon = '<i class="fas fa-exclamation-triangle" style="color:#d97706"></i>';
        else if (type === 'info') icon = '<i class="fas fa-info-circle" style="color:#3b82f6"></i>';
        
        const popup = document.createElement('div');
        popup.id = popupId;
        popup.className = 'popup-message';
        
        popup.innerHTML = `
            <div class="popup-content ${type}">
                <button class="popup-close" onclick="closePopup('${popupId}')">&times;</button>
                <div class="popup-title">${icon} ${title}</div>
                <div class="popup-text">${message}</div>
            </div>
        `;
        
        popupContainer.appendChild(popup);
        setTimeout(() => closePopup(popupId), 4000);
    }

    function closePopup(popupId) {
        const popup = document.getElementById(popupId);
        if (popup) {
            popup.style.animation = 'fadeOut 0.4s ease forwards';
            setTimeout(() => { if(popup.parentNode) popup.parentNode.removeChild(popup); }, 400);
        }
    }

    // --- Sync Logic (Auto Update from Google Sheet) ---
    async function syncDataFromSheet() {
        if (isSyncing) return;
        isSyncing = true;
        
        const indicator = document.getElementById('syncIndicator');
        const syncText = document.getElementById('syncText');
        indicator.classList.add('updating');
        syncText.innerText = "Updating...";
        syncText.style.color = "#d97706";

        try {
            const response = await fetch(G_URL);
            if (response.ok) {
                const data = await response.json();
                if (data.ongoing) {
                    ongoing = data.ongoing;
                    localStorage.setItem('ongoing_v15', JSON.stringify(ongoing));
                }
                if (data.completed) {
                    completed = data.completed;
                    localStorage.setItem('completed_v15', JSON.stringify(completed));
                }
                renderAll();
                syncText.innerText = "Just Updated";
                syncText.style.color = "#059669";
            } else {
                throw new Error("Server response not OK");
            }
        } catch (e) {
            // Silent fail, keep local data
            syncText.innerText = "Using Local";
            syncText.style.color = "#6b7280";
        } finally {
            isSyncing = false;
            setTimeout(() => {
                indicator.classList.remove('updating');
                if(syncText.innerText === "Updating...") syncText.innerText = "Live Sync Active";
            }, 1000);
        }
    }

    // --- Core Functions ---
    function saveData() {
        localStorage.setItem('ongoing_v15', JSON.stringify(ongoing));
        localStorage.setItem('completed_v15', JSON.stringify(completed));
    }

    function renderAll() {
        const searchVal = document.getElementById('searchDate').value;
        const onBody = document.querySelector('#ongoingTable tbody');
        
        // Render Ongoing
        if (ongoing.length === 0) {
            onBody.innerHTML = '<tr><td colspan="6" align="center" style="padding:25px; color:#718096; font-size:0.8rem;"><i class="fas fa-inbox"></i> No Active Tasks Found</td></tr>';
        } else {
            onBody.innerHTML = ongoing.map(t => `
                <tr>
                    <td>
                        <strong><i class="far fa-calendar-alt"></i> ${formatDateDisplay(t.date)}</strong> 
                        <button class="btn-done" onclick="markDone(${t.id})">
                            <i class="fas fa-check"></i> MARK DONE
                        </button>
                    </td>
                    <td style="color:#764ba2; font-weight:600; font-family:'Montserrat';">
                        <i class="far fa-clock"></i> ${t.startTime}
                    </td>
                    <td><b style="font-family:'Montserrat';"><i class="fas fa-ticket-alt"></i> ${t.ticket}</b></td>
                    <td><i class="fas fa-map-marker-alt"></i> ${t.area}</td>
                    <td><span class="badge bg-${t.person.toLowerCase()}"><i class="fas fa-user"></i> ${t.person}</span></td>
                    <td class="status-working"><i class="fas fa-spinner fa-pulse"></i> ${t.remarks}</td>
                </tr>
            `).join('');
        }

        // Render Completed
        const filtered = searchVal ? completed.filter(t => t.date === searchVal) : completed;
        const compBody = document.querySelector('#completedTable tbody');
        
        if (filtered.length === 0) {
            compBody.innerHTML = '<tr><td colspan="7" align="center" style="padding:25px; color:#718096; font-size:0.8rem;"><i class="fas fa-inbox"></i> No Completed Tasks Found</td></tr>';
        } else {
            compBody.innerHTML = filtered.map(t => `
                <tr>
                    <td><strong><i class="far fa-calendar-alt"></i> ${formatDateDisplay(t.date)}</strong></td>
                    <td><i class="far fa-clock"></i> ${t.startTime}</td>
                    <td style="color:#00b09b; font-weight:700; font-family:'Montserrat';">
                        <i class="fas fa-flag-checkered"></i> ${t.doneTime}
                    </td>
                    <td><b style="font-family:'Montserrat';"><i class="fas fa-ticket-alt"></i> ${t.ticket}</b></td>
                    <td><i class="fas fa-map-marker-alt"></i> ${t.area}</td>
                    <td><span class="badge bg-${t.person.toLowerCase()}"><i class="fas fa-user"></i> ${t.person}</span></td>
                    <td style="color:#00b09b; font-weight:700; font-family:'Montserrat';">
                        <i class="fas fa-check-circle"></i> Done
                    </td>
                </tr>
            `).join('');
        }
    }

    async function addTask() {
        const btn = document.getElementById('assignBtn');
        const ticketInput = document.getElementById('ticketInput');
        const ticketValue = ticketInput.value.trim();
        
        if(!ticketValue) {
            showPopup('warning', 'Missing Input', 'Please enter a Ticket ID.');
            ticketInput.focus();
            return;
        }

        if(!validateTicketID(ticketValue)) {
            showPopup('warning', 'Invalid Format', 'Please enter valid ticket id. Formats: L3-22Feb26-030306, TKI011225AA67000218, CR-23Feb26-0176371');
            ticketInput.focus();
            return;
        }
        
        const task = {
            date: document.getElementById('dateInput').value,
            ticket: ticketValue,
            area: document.getElementById('areaInput').value,
            person: document.getElementById('personInput').value,
            startTime: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
            remarks: "Working", 
            id: Date.now()
        };
        
        if(!task.area || !task.person) {
            showPopup('warning', 'Incomplete Info', 'Please select both Area and Staff.');
            return;
        }
        
        const allTickets = [...ongoing, ...completed];
        const isDuplicate = allTickets.some(t => t.ticket === task.ticket);
        
        if(isDuplicate) {
            showPopup('warning', 'Duplicate Ticket', `Ticket ID "${task.ticket}" already exists!`);
            ticketInput.focus();
            return;
        }
        
        btn.innerHTML = '<i class="fas fa-sync fa-spin"></i> Syncing...'; 
        btn.disabled = true;
        
        try {
            await fetch(G_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(task) });
            ongoing.push(task);
            saveData(); 
            renderAll();
            
            ticketInput.value = '';
            document.getElementById('areaInput').value = '';
            document.getElementById('personInput').value = '';
            
            showPopup('success', 'Task Assigned', `${task.ticket} assigned to ${task.person} for ${task.area} area`);
            setTimeout(() => { ticketInput.focus(); }, 300);
            
        } catch(e) { 
            showPopup('warning', 'Sync Error', 'Failed to sync with server! Task saved locally.');
        } finally { 
            btn.innerHTML = '<i class="fas fa-paper-plane"></i> Assign Task'; 
            btn.disabled = false; 
        }
    }

    async function markDone(id) {
        const idx = ongoing.findIndex(t => t.id === id);
        if (idx === -1) return;

        const doneTime = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        const task = {...ongoing[idx], doneTime, remarks: "Done"};
        
        try {
            await fetch(G_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(task) });
            completed.unshift(ongoing.splice(idx, 1)[0]);
            completed[0].doneTime = doneTime; 
            completed[0].remarks = "Done";
            saveData(); 
            renderAll();
            showPopup('success', 'Task Completed', `${task.ticket} completed by ${task.person} at ${doneTime}`);
        } catch(e) { 
            showPopup('warning', 'Sync Error', 'Error syncing with server! Task marked done locally.');
        }
    }

    function clearCompleted() { 
        if(confirm("Are you sure you want to clear all completed tasks? This action cannot be undone.")) { 
            completed = []; 
            saveData(); 
            renderAll();
            showPopup('info', 'Tasks Cleared', 'All completed tasks have been cleared.');
        } 
    }

    // --- Initialization ---
    document.addEventListener('DOMContentLoaded', () => {
        const today = new Date();
        document.getElementById('dateInput').value = today.toISOString().split('T')[0];
        
        renderAll();
        
        setInterval(() => { 
            const now = new Date();
            document.getElementById('liveClock').innerHTML = `<i class="far fa-clock"></i> ${now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'})}`;
            document.getElementById('liveDate').innerHTML = `<i class="far fa-calendar-alt"></i> ${now.toLocaleDateString(undefined, { 
                weekday: 'short', 
                month: 'short', 
                day: 'numeric', 
                year: 'numeric' 
            })}`;
        }, 1000);

        syncDataFromSheet();
        setInterval(syncDataFromSheet, 30000);
    });
</script>
</body>
</html>
