<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="60"> 
    <title>Technician Work Dashboard</title>
	<link rel="shortcut icon" href="technician_favicon.ico" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Montserrat:wght@600;700;800&family=Outfit:wght@400;500&display=swap" rel="stylesheet">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --success-gradient: linear-gradient(135deg, #00b09b 0%, #96c93d 100%);
            --danger-gradient: linear-gradient(135deg, #ff5f6d 0%, #ffc371 100%);
            --company-gradient: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            --bg-color: #f8f9fd;
            --white: #ffffff;
            --radius: 16px;
            --shadow: 0 8px 25px rgba(0, 0, 0, 0.06);
            --table-bg: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
            --table-row-hover: rgba(224, 231, 255, 0.5);
            --table-header-bg: linear-gradient(135deg, #e6f0ff 0%, #e0e7ff 100%);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Outfit', sans-serif; 
            background-color: var(--bg-color); 
            padding: 15px; 
            color: #2d3436;
            background: linear-gradient(135deg, #f8f9fd 0%, #eef2f7 100%);
            min-height: 100vh;
            font-size: 14px;
        }
        .container { 
            max-width: 1000px; 
            margin: 0 auto; 
            transform: scale(0.95);
            transform-origin: top center;
        }

        /* আকর্ষণীয় হেডার ডিজাইন */
        header {
            background: var(--primary-gradient);
            padding: 15px 25px; 
            border-radius: var(--radius);
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow);
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        header::before {
            content: '';
            position: absolute;
            top: -40%;
            right: -15%;
            width: 150px;
            height: 150px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
        }

        header::after {
            content: '';
            position: absolute;
            bottom: -30%;
            left: -8%;
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 50%;
        }

        .header-left {
            position: relative;
            z-index: 2;
            display: flex; 
            align-items: center;
            gap: 15px;
        }

        /* লোগো স্টাইল */
        .company-logo {
            height: 60px; 
            width: 70px;
            display: block;
        }

        .main-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.1rem;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 3px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
            background: linear-gradient(135deg, #ffffff 0%, #e6e6ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .company-name {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 0.3px;
            color: #40E0D0;
            position: relative;
            z-index: 1;
            text-shadow: 0 1px 3px rgba(0, 51, 153, 0.3), 
                         0 1px 0 rgba(255, 255, 255, 0.5);
        }

        .header-right { 
            text-align: right;
            position: relative;
            z-index: 2;
        }

        .datetime-container {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
        }

        #liveDate {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.8rem;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.9);
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }

        #liveClock {
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 0.80rem;
            background: rgba(255, 255, 255, 0.15);
            padding: 6px 14px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
            letter-spacing: 0.8px;
            color: #ffffff;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.2);
            min-width: 120px;
            text-align: center;
        }

         /* কপিরাইট টেক্সট - কার্ডের ভেতরের জন্য */
        .copyright-text {
            font-family: 'Poppins', sans-serif;
            font-size: 0.65rem;
            color: #155DFC; 
            font-weight: 600;
            letter-spacing: 0.3px;
            text-align: left; /* ডান দিকে অ্যালাইন */
            margin-top: 9px; /* টেবিল থেকে কিছু গ্যাপ */
        }


        /* কার্ড ডিজাইন */
        .card { 
            background: var(--white); 
            border-radius: var(--radius); 
            padding: 20px; 
            margin-bottom: 20px; 
            box-shadow: var(--shadow);
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(226, 232, 240, 0.8);
            transition: all 0.3s ease;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.08);
        }

        .card-title {
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 0.8rem;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .card-new { border-top: 5px solid #667eea; }
        .card-ongoing { border-top: 5px solid #f5576c; }
        .card-completed { border-top: 5px solid #00b09b; }

        .sheet-wrapper {
            width: 100%;
            height: 220px;
            overflow: hidden;
            border-radius: 10px;
            border: 1px solid #e2e8f0;
            background: #fff;
            position: relative;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }
        
        .sheet-wrapper iframe { 
            width: 100%; 
            height: 280px; 
            border: none; 
            position: absolute; 
            top: 0; 
            left: 0; 
        }

        /* ফর্ম স্টাইল */
        .form-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); 
            gap: 15px; 
            align-items: end; 
        }
        
        .input-group { 
            display: flex; 
            flex-direction: column; 
            gap: 8px; 
            position: relative;
        }
        
        label { 
            font-family: 'Montserrat', sans-serif;
            font-size: 0.7rem; 
            font-weight: 700; 
            color: #4a5568; 
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        input, select { 
            padding: 12px 14px; 
            border: 2px solid #e2e8f0; 
            border-radius: 8px; 
            outline: none; 
            font-family: 'Outfit', sans-serif; 
            font-size: 0.8rem; 
            background: #fff;
            transition: all 0.2s ease;
        }

        input:focus, select:focus { 
            border-color: #667eea; 
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
        }

        /* টিকেট আইডি হেল্প টেক্সট - REMOVED AS REQUESTED */
        
        /* বাটন স্টাইল */
        .btn-assign { 
            background: var(--primary-gradient); 
            color: white; 
            border: none; 
            padding: 14px; 
            border-radius: 8px; 
            font-family: 'Montserrat', sans-serif;
            font-weight: 700; 
            font-size: 0.75rem;
            cursor: pointer; 
            text-transform: uppercase; 
            letter-spacing: 0.8px;
            transition: all 0.3s ease;
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.25);
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-assign:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 22px rgba(102, 126, 234, 0.35);
        }

        .btn-assign:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* টেবিল স্টাইল - ব্লুইশ ব্যাকগ্রাউন্ড */
        table { 
            width: 100%; 
            border-collapse: collapse; 
            margin-top: 12px;
            background: var(--table-bg);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.08);
            border: 1px solid rgba(224, 231, 255, 0.5);
        }
        
        th { 
            text-align: left; 
            padding: 14px 16px; 
            background: var(--table-header-bg); 
            font-family: 'Montserrat', sans-serif;
            font-size: 0.65rem; 
            color: #4a5568; 
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 2px solid rgba(102, 126, 234, 0.2);
            position: relative;
        }

        th:not(:last-child)::after {
            content: '';
            position: absolute;
            right: 0;
            top: 25%;
            height: 50%;
            width: 1px;
            background: rgba(102, 126, 234, 0.2);
        }
        
        td { 
            padding: 14px 16px; 
            border-bottom: 1px solid rgba(224, 231, 255, 0.4); 
            font-size: 0.8rem; 
            font-family: 'Outfit', sans-serif;
            background: rgba(255, 255, 255, 0.8);
            transition: all 0.2s ease;
        }

        tr:hover td {
            background: var(--table-row-hover);
            transform: translateX(2px);
        }

        tr:last-child td {
            border-bottom: none;
        }

        /* টেবিলের জোড় সারির আলাদা ব্যাকগ্রাউন্ড */
        tr:nth-child(even) td {
            background: rgba(248, 250, 252, 0.9);
        }

        tr:nth-child(even):hover td {
            background: var(--table-row-hover);
        }

        /* ব্যাজ স্টাইল */
        .badge { 
            padding: 6px 12px; 
            border-radius: 25px; 
            font-weight: 600; 
            color: white; 
            font-size: 0.65rem;
            font-family: 'Montserrat', sans-serif;
            display: inline-block;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            display: flex;
            align-items: center;
            gap: 5px;
            width: fit-content;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .bg-sumon { background: linear-gradient(135deg, #20bf6b 0%, #01baef 100%); } 
        .bg-alamin { background: linear-gradient(135deg, #f0932b 0%, #f5576c 100%); }
        .bg-nahid { background: linear-gradient(135deg, #eb4d4b 0%, #d446a6 100%); } 
        .bg-fahim { background: linear-gradient(135deg, #5f27cd 0%, #341f97 100%); }

        /* স্ট্যাটাস এনিমেশন */
        .status-working { 
            color: #f5576c; 
            font-weight: 700; 
            animation: blink 1.5s infinite; 
            font-family: 'Montserrat', sans-serif;
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            background: rgba(245, 87, 108, 0.1);
            border-radius: 6px;
            width: fit-content;
        }
        
        @keyframes blink { 
            50% { opacity: 0.4; } 
        }

        /* ডান বাটন */
        .btn-done { 
            background: var(--success-gradient); 
            color: white; 
            border: none; 
            padding: 8px 14px; 
            border-radius: 6px; 
            cursor: pointer; 
            font-family: 'Montserrat', sans-serif;
            font-weight: 700; 
            font-size: 0.65rem; 
            margin-top: 6px; 
            display: block;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 10px rgba(0, 176, 155, 0.2);
            display: flex;
            align-items: center;
            gap: 5px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-done:hover {
            transform: translateY(-1px);
            box-shadow: 0 5px 12px rgba(0, 176, 155, 0.3);
        }

        /* সার্চ ও ক্লিয়ার বাটন */
        .search-box { 
            padding: 10px 12px; 
            border: 2px solid #00b09b; 
            border-radius: 8px; 
            font-size: 0.75rem; 
            font-family: 'Outfit', sans-serif;
            background: white;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 2px 8px rgba(0, 176, 155, 0.1);
        }
        
        .btn-clear { 
            background: var(--danger-gradient); 
            color: white; 
            border: none; 
            padding: 10px 18px; 
            border-radius: 8px; 
            cursor: pointer; 
            font-family: 'Montserrat', sans-serif;
            font-weight: 700; 
            font-size: 0.75rem; 
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 12px rgba(255, 95, 109, 0.2);
            display: flex;
            align-items: center;
            gap: 6px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-clear:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(255, 95, 109, 0.3);
        }

        /* পপআপ মেসেজ স্টাইল */
        .popup-message {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 10000;
            animation: slideInRight 0.5s ease forwards;
            max-width: 300px;
        }

        .popup-content {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.95) 0%, rgba(248, 249, 253, 0.95) 100%);
            backdrop-filter: blur(15px);
            border-radius: 12px;
            padding: 16px 20px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.4);
            position: relative;
            overflow: hidden;
        }

        .popup-content::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
        }

        .popup-success::before {
            background: linear-gradient(90deg, #00b09b 0%, #96c93d 100%);
        }

        .popup-warning::before {
            background: linear-gradient(90deg, #ffa726 0%, #ff9800 100%);
        }

        .popup-icon {
            font-size: 1.8rem;
            margin-bottom: 10px;
            display: inline-block;
        }

        .popup-title {
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 0.9rem;
            color: #2d3748;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .popup-text {
            font-family: 'Outfit', sans-serif;
            font-size: 0.8rem;
            color: #4a5568;
            line-height: 1.4;
        }

        .popup-close {
            position: absolute;
            top: 10px;
            right: 10px;
            background: none;
            border: none;
            color: #a0aec0;
            font-size: 1rem;
            cursor: pointer;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .popup-close:hover {
            background: rgba(0, 0, 0, 0.05);
            color: #718096;
        }

        @keyframes slideInRight {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes fadeOut {
            from {
                opacity: 1;
                transform: translateX(0);
            }
            to {
                opacity: 0;
                transform: translateX(100%);
                visibility: hidden;
            }
        }

        /* রেসপনসিভ ডিজাইন */
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }
            
            .container {
                transform: scale(1);
                max-width: 100%;
            }
            
            header { 
                flex-direction: column; 
                gap: 15px; 
                text-align: center; 
                padding: 15px; 
            }

            .header-left {
                flex-direction: column;
                text-align: center;
            }
            
            .header-right {
                text-align: center;
                width: 100%;
            }

            .datetime-container {
                align-items: center;
            }
            
            #liveClock {
                min-width: 110px;
            }

            .copyright-text {
                text-align: center; /* মোবাইলে কপিরাইট সেন্টারে */
            }
            
            .form-grid { 
                grid-template-columns: 1fr; 
            }
            
            .card {
                padding: 16px;
            }
            
            th, td {
                padding: 10px 12px;
            }
            
            .popup-message {
                top: 10px;
                right: 10px;
                left: 10px;
                max-width: none;
            }
        }

        /* আইকন স্টাইল */
        .icon-calendar { color: #667eea; }
        .icon-ticket { color: #764ba2; }
        .icon-area { color: #f5576c; }
        .icon-person { color: #00b09b; }
        .icon-dashboard { color: #4834d4; }
        .icon-working { color: #f5576c; }
        .icon-done { color: #00b09b; }
        .icon-search { color: #00b09b; }
        .icon-clear { color: white; }
    </style>
</head>
<body>

<div class="container">
    <!-- আকর্ষণীয় হেডার -->
    <header>
        <div class="header-left">
            <!-- লোগো আপডেট করা হয়েছে -->
            <img src="https://z-cdn-media.chatglm.cn/files/acb00912-a376-4782-b313-80248fd0f8ed.png?auth_key=1870834439-20e10467e7154c949132c6f76f1a421e-0-71eb8030909b232371f257313e5acc97" alt="Link3 Logo" class="company-logo">
            
            <div>
                <div class="main-title">Work Dashboard</div>
                <div class="company-name">Link3 Technologies Ltd</div>
            </div>
        </div>
        <div class="header-right">
            <div class="datetime-container">
                <span id="liveDate"><i class="far fa-calendar-alt"></i> </span>
                <span id="liveClock"><i class="far fa-clock"></i> </span>
                <!-- কপিরাইট এখান থেকে সরানো হয়েছে -->
            </div>
        </div>
    </header>

    <!-- লাইভ সামারি -->
    <div class="card" style="border-top: 5px solid #4834d4;">
        <div class="card-title" style="color:#4834d4;"><i class="fas fa-chart-bar icon-dashboard"></i> TASK LIVE SUMMARY</div>
        <div class="sheet-wrapper">
            <iframe src="https://docs.google.com/spreadsheets/d/e/2PACX-1vTYE61oI9ahQllfKmXmV-ulhGeFDi16gBDgHN8b4NWk9Y3bLyxnyc8S06Wk_TTU21YzVFj2aKKvHDJG/pubhtml?gid=337897408&single=true&widget=false&headers=false&range=A1:M7"></iframe>
        </div>
        <!-- কপিরাইট টেক্সট এখানে যুক্ত করা হয়েছে -->
        <div class="copyright-text">© Ahsanul Kabir</div>
    </div>

    <!-- নতুন টাস্ক এসাইনমেন্ট -->
    <div class="card card-new">
        <div class="card-title" style="color:#667eea;"><i class="fas fa-plus-circle"></i> CREATE NEW ASSIGNMENT</div>
        <div class="form-grid">
            <div class="input-group">
                <label><i class="far fa-calendar-alt icon-calendar"></i> Date</label>
                <input type="date" id="dateInput">
            </div>
            <div class="input-group">
                <label><i class="fas fa-ticket-alt icon-ticket"></i> Ticket ID</label>
                <input type="text" id="ticketInput" placeholder="Enter Ticket ID">
                <!-- শ্যাডো / হিন্ট রিমুভ করা হয়েছে -->
            </div>
            <div class="input-group">
                <label><i class="fas fa-map-marker-alt icon-area"></i> Area</label>
                <select id="areaInput">
                    <option value="">Select Area</option>
                    <option value="Aganagar">Aganagar</option>
                    <option value="Babubazar">Babubazar</option>
                    <option value="Bangshal">Bangshal</option>
                    <option value="BailyRoad">BailyRoad</option>
                    <option value="Chawkbazar">Chawkbazar</option>
                    <option value="Dhalpur">Dhalpur</option>
                    <option value="Donia">Donia</option>
                    <option value="Demra">Demra</option>
                    <option value="Eskaton">Eskaton</option>
                    <option value="Ganderia">Ganderia</option>
                    <option value="Gulistan">Gulistan</option>
                    <option value="Imamganj">Imamganj</option>
                    <option value="Islampur">Islampur</option>
                    <option value="Jatrabari">Jatrabari</option>
		    <option value="Joypara">Joypara</option>
                    <option value="Jurain">Jurain</option>
                    <option value="Kakrail">Kakrail</option>
                    <option value="Kamlapur">Kamlapur</option>
                    <option value="Keraniganj">Keraniganj</option>

<!-- পপআপ মেসেজ কন্টেইনার -->
<div id="popupContainer"></div>

<script>
    const G_URL = "https://script.google.com/macros/s/AKfycbz1ZE69wIfAem_gmCk5v-_2tH6ohSOdZoUkFpE1c0HRnQSqZxHfHVzTvVRAqjCcdB0/exec";
    let ongoing = JSON.parse(localStorage.getItem('ongoing_v14')) || [];
    let completed = JSON.parse(localStorage.getItem('completed_v14')) || [];

    // Helper to format date as DD-MM-YYYY
    function formatDateDisplay(dateStr) {
        if (!dateStr) return "";
        const parts = dateStr.split('-');
        if (parts.length !== 3) return dateStr;
        return `${parts[2]}-${parts[1]}-${parts[0]}`;
    }

    // পপআপ মেসেজ শো করার ফাংশন
    function showPopup(type, title, message) {
        const popupContainer = document.getElementById('popupContainer');
        const popupId = 'popup-' + Date.now();
        
        const popup = document.createElement('div');
        popup.id = popupId;
        popup.className = 'popup-message';
        
        let icon = '';
        if (type === 'success') {
            icon = '✅';
        } else if (type === 'warning') {
            icon = '⚠️';
        } else if (type === 'info') {
            icon = 'ℹ️';
        } else {
            icon = '🚀';
        }
        
        popup.innerHTML = `
            <div class="popup-content ${type === 'success' ? 'popup-success' : ''} ${type === 'warning' ? 'popup-warning' : ''}">
                <button class="popup-close" onclick="closePopup('${popupId}')">×</button>
                <div class="popup-icon">${icon}</div>
                <div class="popup-title">${title}</div>
                <div class="popup-text">${message}</div>
            </div>
        `;
        
        popupContainer.appendChild(popup);
        
        // ৫ সেকেন্ড পর অটোমেটিক বন্ধ
        setTimeout(() => {
            closePopup(popupId);
        }, 5000);
    }

    // পপআপ বন্ধ করার ফাংশন
    function closePopup(popupId) {
        const popup = document.getElementById(popupId);
        if (popup) {
            popup.style.animation = 'fadeOut 0.5s ease forwards';
            setTimeout(() => {
                if (popup && popup.parentNode) {
                    popup.parentNode.removeChild(popup);
                }
            }, 500);
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        // Set today's date as default
        const today = new Date();
        const formattedDate = today.toISOString().split('T')[0];
        document.getElementById('dateInput').value = formattedDate;
        
        // Set focus on ticket input (NO popup message)
        setTimeout(() => {
            document.getElementById('ticketInput').focus();
        }, 500);
        
        renderAll();
        
        // লাইভ ডেট-টাইম আপডেট
        setInterval(() => { 
            const now = new Date();
            document.getElementById('liveClock').innerHTML = `<i class="far fa-clock"></i> ${now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'})}`;
            document.getElementById('liveDate').innerHTML = `<i class="far fa-calendar-alt"></i> ${now.toLocaleDateString(undefined, { 
                weekday: 'short', 
                month: 'short', 
                day: 'numeric', 
                year: 'numeric' 
            })}`;
        }, 1000);
    });

    async function addTask() {
        const btn = document.getElementById('assignBtn');
        const ticketInput = document.getElementById('ticketInput');
        const ticketValue = ticketInput.value.trim();
        
        // Check if ticket ID is empty
        if(!ticketValue) {
            showPopup('warning', 'Ticket ID Required', 'Please enter a Ticket ID (e.g., L3-10Feb24-001)');
            ticketInput.focus();
            return;
        }
        
        const task = {
            date: document.getElementById('dateInput').value,
            ticket: ticketValue,
            area: document.getElementById('areaInput').value,
            person: document.getElementById('personInput').value,
            startTime: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
            remarks: "Working", 
            id: Date.now()
        };
        
        if(!task.area || !task.person) {
            showPopup('warning', 'Missing Information', 'Please select both Area and Staff!');
            return;
        }
        
        // ডুপ্লিকেট টিকেট চেক করুন
        const allTickets = [...ongoing, ...completed];
        const isDuplicate = allTickets.some(t => t.ticket === task.ticket);
        
        if(isDuplicate) {
            showPopup('warning', 'Duplicate Ticket', `Ticket ID "${task.ticket}" already exists in ongoing or completed tasks!`);
            ticketInput.focus();
            return;
        }
        
        btn.innerHTML = '<i class="fas fa-sync fa-spin"></i> Syncing...'; 
        btn.disabled = true;
        
        try {
            await fetch(G_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(task) });
            ongoing.push(task);
            saveData(); 
            renderAll();
            
            // Clear form
            ticketInput.value = '';
            document.getElementById('areaInput').value = '';
            document.getElementById('personInput').value = '';
            
            // টাস্ক এসাইন করা হলে পপআপ মেসেজ শো করা
            showPopup('success', 'Task Assigned', `${task.ticket} assigned to ${task.person} for ${task.area} area`);
            
            // Focus back to ticket input for next entry
            setTimeout(() => {
                ticketInput.focus();
            }, 300);
            
        } catch(e) { 
            showPopup('warning', 'Sync Error', 'Failed to sync with server! Task saved locally.');
        } finally { 
            btn.innerHTML = '<i class="fas fa-paper-plane"></i> Assign Task'; 
            btn.disabled = false; 
        }
    }

    async function markDone(id) {
        const idx = ongoing.findIndex(t => t.id === id);
        const doneTime = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        const task = {...ongoing[idx], doneTime, remarks: "Done"};
        
        try {
            await fetch(G_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(task) });
            completed.unshift(ongoing.splice(idx, 1)[0]);
            completed[0].doneTime = doneTime; 
            completed[0].remarks = "Done";
            saveData(); 
            renderAll();
            
            // টাস্ক কমপ্লিট করা হলে পপআপ মেসেজ শো করা
            showPopup('success', 'Task Completed', `${task.ticket} completed by ${task.person} at ${doneTime}`);
            
        } catch(e) { 
            showPopup('warning', 'Sync Error', 'Error syncing with server! Task marked done locally.');
        }
    }

    function clearCompleted() { 
        if(confirm("Are you sure you want to clear all completed tasks? This action cannot be undone.")) { 
            completed = []; 
            saveData(); 
            renderAll();
            showPopup('info', 'Tasks Cleared', 'All completed tasks have been cleared.');
        } 
    }

    function saveData() {
        localStorage.setItem('ongoing_v14', JSON.stringify(ongoing));
        localStorage.setItem('completed_v14', JSON.stringify(completed));
    }

    function renderAll() {
        const searchVal = document.getElementById('searchDate').value;
        const onBody = document.querySelector('#ongoingTable tbody');
        
        onBody.innerHTML = ongoing.map(t => `
            <tr>
                <td>
                    <strong><i class="far fa-calendar-alt"></i> ${formatDateDisplay(t.date)}</strong> 
                    <button class="btn-done" onclick="markDone(${t.id})">
                        <i class="fas fa-check"></i> MARK DONE
                    </button>
                </td>
                <td style="color:#764ba2; font-weight:600; font-family:'Montserrat';">
                    <i class="far fa-clock"></i> ${t.startTime}
                </td>
                <td><b style="font-family:'Montserrat';"><i class="fas fa-ticket-alt"></i> ${t.ticket}</b></td>
                <td><i class="fas fa-map-marker-alt"></i> ${t.area}</td>
                <td><span class="badge bg-${t.person.toLowerCase()}"><i class="fas fa-user"></i> ${t.person}</span></td>
                <td class="status-working"><i class="fas fa-spinner fa-pulse"></i> ${t.remarks}</td>
            </tr>
        `).join('') || '<tr><td colspan="6" align="center" style="padding:25px; color:#718096; font-size:0.8rem;"><i class="fas fa-inbox"></i> No Active Tasks Found</td></tr>';

        const filtered = searchVal ? completed.filter(t => t.date === searchVal) : completed;
        document.querySelector('#completedTable tbody').innerHTML = filtered.map(t => `
            <tr>
                <td><strong><i class="far fa-calendar-alt"></i> ${formatDateDisplay(t.date)}</strong></td>
                <td><i class="far fa-clock"></i> ${t.startTime}</td>
                <td style="color:#00b09b; font-weight:700; font-family:'Montserrat';">
                    <i class="fas fa-flag-checkered"></i> ${t.doneTime}
                </td>
                <td><b style="font-family:'Montserrat';"><i class="fas fa-ticket-alt"></i> ${t.ticket}</b></td>
                <td><i class="fas fa-map-marker-alt"></i> ${t.area}</td>
                <td><span class="badge bg-${t.person.toLowerCase()}"><i class="fas fa-user"></i> ${t.person}</span></td>
                <td style="color:#00b09b; font-weight:700; font-family:'Montserrat';">
                    <i class="fas fa-check-circle"></i> Done
                </td>
            </tr>
        `).join('') || '<tr><td colspan="7" align="center" style="padding:25px; color:#718096; font-size:0.8rem;"><i class="fas fa-inbox"></i> No Completed Tasks Found</td></tr>';
    }
</script>
</body>
</html>
